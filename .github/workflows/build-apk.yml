name: Build Sonara APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The project has no gradlew file, so install Gradle directly.
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Optional: add a repository secret named JAMENDO_CLIENT_ID to enable online music in this build.
      - name: Add Jamendo client ID (optional)
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          if [ -n "$JAMENDO_CLIENT_ID" ]; then
            echo "JAMENDO_CLIENT_ID=$JAMENDO_CLIENT_ID" >> local.properties
          fi

      - name: Run unit tests and build debug APK
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --console=plain --no-daemon --continue 2>&1 | tee build.log

      # Only runs when the build fails. Puts the real error in a short, readable place:
      # the "Annotations" list and the summary at the bottom of the run page.
      - name: Show why the build failed
        if: failure()
        run: |
          {
            grep -E "^e: " build.log | sed "s#file://$GITHUB_WORKSPACE/##" | head -30 || true
            grep -A8 "What went wrong" build.log | head -20 || true
          } > errors.txt
          if [ -s errors.txt ]; then
            cat errors.txt
            msg=$(head -c 3500 errors.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=Why the build failed::${msg}"
            {
              echo '### Why the build failed'
              echo '```'
              cat errors.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::No error lines found. Open the Run unit tests and build debug APK step and look near the end of the log."
          fi

      - name: Upload APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonara-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Also attach the APK to a Release so you can download it straight from your phone.
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Sonara debug build
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
